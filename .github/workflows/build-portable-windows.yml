name: Build Portable Windows App

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build portable app
        shell: pwsh
        run: .\build_portable.ps1

      - name: Archive portable folder
        shell: pwsh
        run: Compress-Archive -Path dist\PhotoCuller\* -DestinationPath dist\PhotoCuller-windows-portable.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCuller-windows-portable-${{ github.sha }}
          path: dist/PhotoCuller-windows-portable.zip
          if-no-files-found: error

      - name: Publish GitHub release asset (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhotoCuller-windows-portable.zip
          generate_release_notes: true
